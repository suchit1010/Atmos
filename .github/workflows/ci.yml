name: CI

on:
  push:
    branches: [ main, umbra ]
  pull_request:
    branches: [ main, umbra ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend (vercel)
        run: pnpm run build:vercel

      - name: Build frontend (mockup-sandbox)
        run: pnpm --filter @workspace/mockup-sandbox run build

      - name: Upload API dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: app/api-server/dist

      - name: Upload mockup dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: mockup-dist
          path: app/mockup-sandbox/dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build backend Docker image (no-push)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: app/api-server/Dockerfile
          platforms: linux/amd64
          push: false
          tags: atmos-api:ci-${{ github.run_id }}

      - name: Build mockup Docker image (no-push)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: app/mockup-sandbox/Dockerfile
          platforms: linux/amd64
          push: false
          tags: atmos-web:ci-${{ github.run_id }}

  deploy:
    if: ${{ secrets.VERCEL_TOKEN != '' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for deploy
        run: pnpm run build:vercel

      - name: Install Vercel CLI
        run: npm i -g vercel@29

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel --prod --token $VERCEL_TOKEN --confirm

  publish-images:
    if: secrets.REGISTRY_USERNAME && secrets.REGISTRY_PASSWORD && secrets.REGISTRY_HOST
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: app/api-server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.REGISTRY_HOST }}/atmos/api:latest
            ${{ secrets.REGISTRY_HOST }}/atmos/api:${{ github.sha }}

      - name: Build and push mockup image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: app/mockup-sandbox/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.REGISTRY_HOST }}/atmos/web:latest
            ${{ secrets.REGISTRY_HOST }}/atmos/web:${{ github.sha }}
