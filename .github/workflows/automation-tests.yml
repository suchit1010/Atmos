name: Automation Tests

on:
  push:
    paths:
      - 'automation-tests/**'
  pull_request:
    paths:
      - 'automation-tests/**'

jobs:
  production-tests:
    name: Run production automation tests and upload reports
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: automation-tests
        run: npm install --no-audit --prefer-offline

      - name: Run production tests and generate reports
        working-directory: automation-tests
        env:
          CI: true
        run: |
          npm run test:production:report

      - name: Upload reports artifact
        uses: actions/upload-artifact@v4
        with:
          name: automation-test-reports
          path: automation-tests/reports
