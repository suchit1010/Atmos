<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATMOS Protocol — Pitch Deck</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=DM+Mono:wght@300;400;500&family=Outfit:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#030B05;
  --paper:#040E07;
  --card:#071510;
  --lift:#0B1F12;
  --g1:#22C55E;
  --g2:#16A34A;
  --g3:#0D7A35;
  --dim:rgba(34,197,94,.12);
  --glow:rgba(34,197,94,.22);
  --soft:rgba(34,197,94,.06);
  --text:#E4F0E7;
  --muted:#6B9B74;
  --faint:#2A4530;
  --border:rgba(34,197,94,.12);
  --border2:rgba(34,197,94,.24);
  --gold:#D4AF6A;
  --red:#FF5858;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:var(--ink);
  font-family:'Outfit',sans-serif;
  color:var(--text);
  min-height:100vh;
  overflow:hidden;
  user-select:none;
  display:flex;
  align-items:center;
  justify-content:center;
}

.hero {
  text-align: center;
  z-index: 2;
  position: relative;
}

.hero-logo {
  width: 120px;
  height: 120px;
  margin: 0 auto 40px;
  animation: spin 30s linear infinite;
  opacity: 0.9;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.hero h1 {
  font-family:'Cormorant Garamond',serif;
  font-size: clamp(48px, 6vw, 88px);
  font-weight: 300;
  line-height: 1.0;
  letter-spacing: -1px;
  margin-bottom: 12px;
}

.hero h1 em {
  font-style: italic;
  color: var(--g1);
}

.hero p {
  font-size: 18px;
  font-weight: 300;
  line-height: 1.7;
  color: var(--muted);
  max-width: 560px;
  margin: 24px auto;
}

.hero-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: transparent;
  border: 1px solid rgba(34,197,94,.24);
  color: var(--g1);
  font-family: 'Outfit', sans-serif;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: 1px;
  padding: 12px 28px;
  border-radius: 32px;
  cursor: pointer;
  transition: all .2s ease;
  text-decoration: none;
  margin-top: 32px;
}

.hero-btn:hover {
  background: var(--dim);
  border-color: var(--g1);
}

.topbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 48px;
  border-bottom: 1px solid rgba(34,197,94,.12);
  background: linear-gradient(180deg, rgba(4,14,7,.95) 0%, transparent 100%);
  z-index: 100;
}

.logo-mark {
  display: flex;
  align-items: center;
  gap: 14px;
}

.logo-svg {
  width: 32px;
  height: 32px;
}

.logo-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  font-weight: 600;
  color: var(--g1);
  letter-spacing: 2px;
}

.logo-sub {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 3px;
  margin-top: 2px;
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo-mark">
    <svg class="logo-svg" viewBox="0 0 100 100">
      <defs><clipPath id="c1"><circle cx="50" cy="50" r="46"/></clipPath></defs>
      <circle cx="50" cy="50" r="46" fill="none" stroke="#22C55E" stroke-width="2.2"/>
      <circle cx="50" cy="50" r="23.4" fill="none" stroke="#22C55E" stroke-width="1.4" clip-path="url(#c1)"/>
      <circle cx="50" cy="26.6" r="23.4" fill="none" stroke="#22C55E" stroke-width="1.4" clip-path="url(#c1)"/>
      <circle cx="70.3" cy="38.3" r="23.4" fill="none" stroke="#22C55E" stroke-width="1.4" clip-path="url(#c1)"/>
      <circle cx="70.3" cy="61.7" r="23.4" fill="none" stroke="#22C55E" stroke-width="1.4" clip-path="url(#c1)"/>
      <circle cx="50" cy="73.4" r="23.4" fill="none" stroke="#22C55E" stroke-width="1.4" clip-path="url(#c1)"/>
      <circle cx="29.7" cy="61.7" r="23.4" fill="none" stroke="#22C55E" stroke-width="1.4" clip-path="url(#c1)"/>
      <circle cx="29.7" cy="38.3" r="23.4" fill="none" stroke="#22C55E" stroke-width="1.4" clip-path="url(#c1)"/>
    </svg>
    <div>
      <div class="logo-name">ATMOS</div>
      <div class="logo-sub">PROTOCOL</div>
    </div>
  </div>
  <div style="font-family:'DM Mono',monospace;font-size:12px;color:var(--muted);letter-spacing:2px;">PITCH DECK</div>
</div>

<div class="hero">
  <svg class="hero-logo" viewBox="0 0 100 100">
    <defs><clipPath id="c2"><circle cx="50" cy="50" r="46"/></clipPath></defs>
    <circle cx="50" cy="50" r="46" fill="none" stroke="#22C55E" stroke-width="1.8"/>
    <circle cx="50" cy="50" r="38" fill="none" stroke="rgba(34,197,94,.3)" stroke-width=".8"/>
    <circle cx="50" cy="50" r="23.4" fill="none" stroke="#22C55E" stroke-width="1.2" clip-path="url(#c2)"/>
    <circle cx="50" cy="26.6" r="23.4" fill="none" stroke="#22C55E" stroke-width="1.2" clip-path="url(#c2)"/>
    <circle cx="70.3" cy="38.3" r="23.4" fill="none" stroke="#22C55E" stroke-width="1.2" clip-path="url(#c2)"/>
    <circle cx="70.3" cy="61.7" r="23.4" fill="none" stroke="#22C55E" stroke-width="1.2" clip-path="url(#c2)"/>
    <circle cx="50" cy="73.4" r="23.4" fill="none" stroke="#22C55E" stroke-width="1.2" clip-path="url(#c2)"/>
    <circle cx="29.7" cy="61.7" r="23.4" fill="none" stroke="#22C55E" stroke-width="1.2" clip-path="url(#c2)"/>
    <circle cx="29.7" cy="38.3" r="23.4" fill="none" stroke="#22C55E" stroke-width="1.2" clip-path="url(#c2)"/>
  </svg>

  <h1>ATMOS<br><em>Protocol</em></h1>
  <p>Carbon infrastructure for the planet.<br>Verified. Private. Instant. Global.</p>
  
  <a href="ATMOS_Pitch.html" class="hero-btn">View Full Pitch Deck →</a>

  <p style="margin-top: 60px; font-size: 14px; color: var(--faint);">
    AI + Satellite MRV · ZK Proofs · Solana Settlement · Privacy First
  </p>
</div>

</body>
</html>
