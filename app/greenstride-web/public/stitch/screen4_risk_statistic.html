<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>GreenStride - CO2 Risk Statistic</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            appBg: '#F8F9FA',
            mintCard: '#E2F2DF',
            leafGreen: '#52B788',
            accentGreen: '#3EA572',
            darkText: '#181B1A',
            dimText: '#8E9491',
            lightBorder: '#EDF1EE'
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"Segoe UI"', 'Roboto', 'sans-serif'],
          },
          borderRadius: {
            '3xl': '28px',
            '4xl': '36px',
            '5xl': '44px'
          }
        }
      }
    }
  </script>
<style data-purpose="custom-elements">
    /* Remove scrollbars for pristine mobile viewport */
    body {
      -webkit-font-smoothing: antialiased;
      background-color: #ECEEEF;
    }
    
    /* Gauge circular meter styles */
    .gauge-progress-circle {
      stroke-dasharray: 660;
      stroke-dashoffset: 240;
      transform: rotate(-130deg);
      transform-origin: 50% 50%;
    }

    .gauge-dotted-track {
      stroke-dasharray: 4 14;
      transform: rotate(0deg);
      transform-origin: 50% 50%;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-0 sm:p-4 select-none">
<!-- BEGIN: MobileContainer -->
<div class="w-full max-w-[390px] h-[844px] bg-[#F7F9F7] rounded-none sm:rounded-[48px] overflow-hidden shadow-2xl relative flex flex-col justify-between border-0 sm:border-[8px] sm:border-[#1F2123]" data-purpose="mobile-screen">
<!-- Top Content Area (Scrollable if needed, fits within 844px standard iOS screen) -->
<div class="px-5 pt-8 pb-2 flex-1 flex flex-col justify-between overflow-y-auto no-scrollbar">
<!-- BEGIN: HeaderSection -->
<header class="flex items-center justify-between pt-3" data-purpose="app-header">
<!-- User Profile Area -->
<div class="flex items-center gap-3">
<!-- Avatar with leaf badge -->
<div class="relative w-12 h-12">
<img alt="Ludmila" class="w-12 h-12 rounded-full object-cover border-2 border-white shadow-sm" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAcK8EW2xc0kY7dxJqxdQNj6G8e1WWn7XBRGUJRDVfFKokuMPUAP49mJQmgeJZQlI2tFFR3zf1IfMKl9bx2idsONofBUGUqFdIW9Pr8r3NfgE9c5eBs8J5-DmO_4LJUmF8hArk9BXi9s9we0IJNr0OsY--SE6J8ZjQnqCU35KnKJOi8mQ0Sxqc3zUu37bQffTFT-ND1OO8K3CJJYul5ZakZO09pgwBdwoOVYQz9fHrnBtWHLI0j0dlOIQ"/>
<!-- Leaf Badge -->
<div class="absolute -bottom-1 -right-1 w-5 h-5 bg-[#E2F2DF] rounded-full flex items-center justify-center border border-white">
<svg class="w-3 h-3 text-[#3EA572]" fill="currentColor" viewbox="0 0 24 24">
<path d="M17 8C8 10 5.9 16.17 3.82 21.34L5.71 22l1-2.3A9.49 9.49 0 0 0 17 8z"></path>
<path d="M21 3s-4.5 0-9 4c4 4 9 3 9 3z"></path>
</svg>
</div>
</div>
<!-- Name and Level Progress Bar -->
<div class="flex flex-col">
<h1 class="text-[17px] font-bold text-darkText leading-tight">Ludmila</h1>
<div class="mt-1.5 flex items-center">
<div class="w-24 h-1.5 bg-[#E8EBE9] rounded-full relative">
<!-- Progress Line -->
<div class="w-10 h-full bg-[#3EA572] rounded-full"></div>
<!-- Progress Indicator Dot -->
<div class="absolute left-9 -top-[3px] w-3 h-3 bg-[#3EA572] border-2 border-white rounded-full shadow-xs"></div>
</div>
</div>
</div>
</div>
<!-- Notification Button -->
<div class="relative">
<button class="w-10 h-10 bg-[#141716] rounded-2xl flex items-center justify-center text-white shadow-sm hover:opacity-90 transition-opacity" data-purpose="notification-button">
<!-- Mail / Notification Envelope Icon -->
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M21 8.25v7.5a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 15.75v-7.5m18 0A2.25 2.25 0 0018.75 6H5.25A2.25 2.25 0 003 8.25m18 0l-9 5.25-9-5.25" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Notification Red Alert Dot -->
<span class="absolute 1 top-0.5 right-0.5 w-2 h-2 bg-[#FF4D4D] rounded-full border border-white"></span>
</div>
</header>
<!-- END: HeaderSection -->
<!-- BEGIN: DualSummaryCards -->
<section class="grid grid-cols-2 gap-3.5 my-4" data-purpose="metric-cards">
<!-- Trees Metric Card -->
<div class="bg-white rounded-3xl p-4 flex flex-col justify-between shadow-[0_4px_20px_rgba(0,0,0,0.02)] border border-[#F0F2F0] min-h-[120px]">
<div class="flex items-center gap-2.5">
<div class="w-8 h-8 rounded-full bg-[#F3F6F3] flex items-center justify-center text-[#1E2521]">
<!-- Pine Tree Icon -->
<svg class="w-4 h-4" fill="currentColor" viewbox="0 0 24 24">
<path d="M12 2L6 10h3l-4 6h5v4h4v-4h5l-4-6h3L12 2z"></path>
</svg>
</div>
<span class="text-[13px] font-medium text-dimText">Trees</span>
</div>
<div class="mt-3">
<span class="text-2xl font-extrabold tracking-tight text-darkText">11,234</span>
</div>
</div>
<!-- Total CO2 Metric Card -->
<div class="bg-mintCard rounded-3xl p-4 flex flex-col justify-between shadow-[0_4px_20px_rgba(0,0,0,0.02)] min-h-[120px]">
<div class="flex items-center gap-2.5">
<div class="w-8 h-8 rounded-full bg-[#141716] flex items-center justify-center text-white">
<!-- Cloud CO2 Icon -->
<span class="text-[9px] font-bold tracking-tighter">CO₂</span>
</div>
<span class="text-[13px] font-semibold text-darkText">Total CO2</span>
</div>
<div class="mt-3">
<span class="text-xl font-extrabold tracking-tight text-darkText leading-none">0,04 <span class="text-sm font-semibold">mg/m³</span></span>
</div>
</div>
</section>
<!-- END: DualSummaryCards -->
<!-- BEGIN: StatisticTitleWithTabs -->
<section class="flex items-center justify-between mb-1 mt-1" data-purpose="section-header">
<h2 class="text-[18px] font-bold text-darkText tracking-tight">CO2 risk statistic</h2>
<!-- Period Filter Pills -->
<div class="flex items-center space-x-1.5 text-xs font-semibold">
<button class="w-6 h-6 rounded-full bg-[#141716] text-white flex items-center justify-center shadow-xs">D</button>
<button class="w-6 h-6 rounded-full text-dimText hover:text-darkText flex items-center justify-center">W</button>
<button class="w-6 h-6 rounded-full text-dimText hover:text-darkText flex items-center justify-center">M</button>
<button class="w-6 h-6 rounded-full text-dimText hover:text-darkText flex items-center justify-center">Y</button>
</div>
</section>
<!-- END: StatisticTitleWithTabs -->
<!-- BEGIN: CentralGaugeDial -->
<section class="relative flex items-center justify-center py-2" data-purpose="co2-gauge">
<div class="relative w-[240px] h-[240px] flex items-center justify-center">
<!-- Outer Subtle Accent Halo -->
<div class="absolute inset-0 rounded-full border border-[#EEF2EE]"></div>
<svg class="w-full h-full transform -rotate-90" viewbox="0 0 240 240">
<!-- Background Circular Track -->
<circle cx="120" cy="120" fill="none" r="105" stroke="#EFF3EE" stroke-width="5"></circle>
<!-- Outer Mint Progress Arc -->
<circle cx="120" cy="120" fill="none" r="105" stroke="#52B788" stroke-dasharray="660" stroke-dashoffset="360" stroke-linecap="round" stroke-width="5.5"></circle>
<!-- Inner Dotted Arc -->
<circle class="gauge-dotted-track opacity-90" cx="120" cy="120" fill="none" r="84" stroke="#76C49A" stroke-linecap="round" stroke-width="4.5"></circle>
</svg>
<!-- Outer Ring Indicator Knob -->
<div class="absolute top-[20px] right-[42px] w-5 h-5 bg-[#E3F4E5] rounded-full flex items-center justify-center shadow-xs">
<div class="w-2.5 h-2.5 bg-[#40916C] rounded-full"></div>
</div>
<!-- Central Data Content Inside Dial -->
<div class="absolute inset-0 flex flex-col items-center justify-center text-center pointer-events-none px-4">
<!-- Center Black Cloud/CO2 icon -->
<div class="w-8 h-8 rounded-full bg-[#161817] flex items-center justify-center text-white mb-2 shadow-xs">
<span class="text-[9px] font-bold">CO₂</span>
</div>
<span class="text-[11px] font-medium text-dimText tracking-wide">Today's CO2 level</span>
<span class="text-[19px] font-extrabold text-darkText tracking-tight mt-0.5">0,0409 mg/m³</span>
</div>
</div>
</section>
<!-- END: CentralGaugeDial -->
<!-- BEGIN: RiskStatusAndLink -->
<section class="flex items-center justify-between pb-3 pt-1 px-1" data-purpose="risk-status">
<!-- Status Indicator -->
<div class="flex items-center text-[13px] font-semibold text-darkText space-x-1.5">
<span class="text-dimText font-normal">Risk percentage:</span>
<span class="w-2 h-2 rounded-full bg-[#3EA572] inline-block"></span>
<span>Low</span>
</div>
<!-- All Statistic Button -->
<button class="text-[13px] font-semibold text-darkText flex items-center gap-1 hover:text-accentGreen transition-colors">
<span>All statistic</span>
<svg class="w-3.5 h-3.5 stroke-[2.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M4.5 19.5l15-15m0 0H8.25m11.25 0v11.25" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</section>
<!-- END: RiskStatusAndLink -->
</div>
<!-- BEGIN: BottomNavigation -->
<nav class="relative pb-6 pt-3 px-6 bg-white/70 backdrop-blur-md border-t border-[#EEF0EE]/80" data-purpose="floating-dock-nav">
<div class="flex items-center justify-between max-w-[320px] mx-auto">
<!-- Home Button -->
<button aria-label="Home" class="p-2 text-darkText hover:text-accentGreen transition-colors">
<svg class="w-5 h-5 fill-current" viewbox="0 0 24 24">
<path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"></path>
</svg>
</button>
<!-- Globe Button -->
<button aria-label="Global" class="p-2 text-[#9EA3A0] hover:text-darkText transition-colors">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<circle cx="12" cy="12" r="10"></circle>
<path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" stroke-linecap="round"></path>
</svg>
</button>
<!-- Center Prominent Scan Action Button -->
<div class="relative -top-4">
<button aria-label="Scan / Viewfinder" class="w-13 h-13 w-[52px] h-[52px] bg-[#141716] rounded-full flex items-center justify-center text-white shadow-lg active:scale-95 transition-transform">
<!-- Viewfinder / QR / Focus Reticle Icon -->
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M3.75 7.5A3.75 3.75 0 0 1 7.5 3.75h1.5m6 0h1.5a3.75 3.75 0 0 1 3.75 3.75v1.5m0 6v1.5a3.75 3.75 0 0 1-3.75 3.75h-1.5m-6 0h-1.5a3.75 3.75 0 0 1-3.75-3.75v-1.5m6-3a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- Settings Gear Button -->
<button aria-label="Settings" class="p-2 text-[#9EA3A0] hover:text-darkText transition-colors">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Profile Button -->
<button aria-label="Profile" class="p-2 text-[#9EA3A0] hover:text-darkText transition-colors">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- iOS Home Indicator -->
<div class="w-32 h-1 bg-black/20 rounded-full mx-auto mt-3"></div>
</nav>
<!-- END: BottomNavigation -->
</div>
<!-- END: MobileContainer -->
</body></html>
