<!DOCTYPE html>

<!-- Tailwind CSS v3 CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>

            darkText: '#181B1A',
            subText: '#8E9493',
            brandGreen: '#35C46A',
            lightGreen: '#EBF7EE',
            sageGreen: '#8DC698',

<body>

</div>
</div>
<!-- Name & Slider -->
<div>

</div>
</div>
</div>

<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>

<!-- END: TopProfileHeader -->
<!-- BEGIN: SectionHeader -->
<section class="flex items-center justify-between mt-6" data-purpose="title-and-date">
<h1 class="text-2xl font-bold text-darkText tracking-tight">Green Stride</h1>

<svg class="w-3.5 h-3.5 text-darkText" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<rect height="18" rx="2" ry="2" width="18" x="3" y="4"></rect>
<line x1="16" x2="16" y1="2" y2="6"></line>
<line x1="8" x2="8" y1="2" y2="6"></line>
<line x1="3" x2="21" y1="10" y2="10"></line>
</svg>
<span class="text-xs font-medium text-darkText">June 20</span>
</div>
</section>
<!-- END: SectionHeader -->

<circle cx="60" cy="60" r="42" stroke="#EEF3F0" stroke-dasharray="2 2" stroke-width="1"></circle>
<circle cx="60" cy="60" r="54" stroke="#EEF3F0" stroke-dasharray="2 2" stroke-width="1"></circle>

<circle cx="60" cy="60" fill="#1C1F22" r="3.5"></circle>
<circle cx="60" cy="60" r="6" stroke="#1C1F22" stroke-width="1"></circle>
<!-- Left sector: Dark/Black Pine Trees (pointing outwards radially) -->
<g fill="#181B1A">

<path d="M52 14 L58 23 L46 23 Z"></path>
</g>

<path d="M42 62 L48 65 L48 59 Z" transform="rotate(-90 45 62)"></path>
<path d="M28 62 L35 66 L35 58 Z" transform="rotate(-90 31 62)"></path>
<path d="M14 62 L22 67 L22 57 Z" transform="rotate(-90 18 62)"></path>
<!-- Bottom Left -->
<path d="M47 70 L51 76 L43 76 Z"></path>
<path d="M36 79 L41 87 L31 87 Z"></path>
<path d="M25 89 L31 99 L19 99 Z"></path>
<path d="M54 75 L58 81 L50 81 Z"></path>

</g>

<path d="M72 31 L77 39 L67 39 Z"></path>
<path d="M78 18 L84 27 L72 27 Z"></path>
<path d="M73 49 L77 55 L69 55 Z"></path>
<path d="M85 41 L90 49 L80 49 Z"></path>
<path d="M96 32 L102 41 L90 41 Z"></path>
<path d="M76 60 L80 66 L72 66 Z"></path>
<path d="M90 59 L95 67 L85 67 Z"></path>
<path d="M102 58 L108 67 L96 67 Z"></path>
<!-- Bottom Right Sector -->
<path d="M71 71 L75 77 L67 77 Z"></path>
<path d="M82 78 L87 86 L77 86 Z"></path>
<path d="M92 86 L98 95 L86 95 Z"></path>
<path d="M62 76 L66 82 L58 82 Z"></path>
<path d="M66 88 L71 96 L61 96 Z"></path>
<path d="M70 101 L76 110 L64 110 Z"></path>
</g>
</svg>
</div>
</div>
<!-- Right Card: Switch to 3D Mode Card -->

<div class="flex items-center justify-between">
<span class="text-[11.5px] font-semibold text-darkText tracking-tight">Switch to 3D mode</span>
<svg class="w-3.5 h-3.5 text-darkText" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24">
<line x1="7" x2="17" y1="17" y2="7"></line>
<polyline points="7 7 17 7 17 17"></polyline>
</svg>
</div>
<!-- 3D Island Sphere Graphic -->
<div class="flex items-center justify-center flex-1 my-1">
<div class="relative w-[114px] h-[114px] rounded-full overflow-hidden flex items-center justify-center shadow-inner">
<!-- Miniature Lush Biosphere Planet Graphic -->
<svg class="w-full h-full transform hover:scale-105 transition-transform duration-300" viewbox="0 0 100 100">
<defs>
<radialgradient cx="45%" cy="40%" id="planetShade" r="55%">
<stop offset="0%" stop-color="#E8F9EB"></stop>
<stop offset="60%" stop-color="#CAEBD0"></stop>
<stop offset="100%" stop-color="#A5D4AE"></stop>
</radialgradient>
<filter height="130%" id="shadow3D" width="130%" x="-10%" y="-10%">
<fedropshadow dx="1" dy="2" flood-color="#143A1B" flood-opacity="0.15" stddeviation="2"></fedropshadow>
</filter>
</defs>
<!-- Base Sphere -->
<circle cx="50" cy="50" fill="url(#planetShade)" r="47"></circle>

<!-- North-West cluster -->
<circle cx="33" cy="30" fill="#1B5E20" r="3.2"></circle>
<circle cx="39" cy="27" fill="#2E7D32" r="2.8"></circle>
<circle cx="35" cy="36" fill="#194D20" r="3.5"></circle>

<circle cx="70" cy="46" fill="#1B5E20" r="3.8"></circle>
<circle cx="68" cy="54" fill="#2E7D32" r="3.2"></circle>

<!-- BEGIN: PerformanceSection -->
<section class="mt-7" data-purpose="performance-chart-container">
<!-- Title and description -->
<h2 class="text-[19px] font-bold text-darkText tracking-tight">Your perfomance</h2>
<p class="text-xs text-subText mt-1.5 leading-relaxed pr-2">
          Your investment is susceptible to greater vulnerability from external influences.
        </p>
<!-- Chart Area -->
<div class="relative w-full h-[150px] mt-4 overflow-hidden rounded-2xl" data-purpose="performance-wave-chart">
<svg class="w-full h-full" fill="none" preserveaspectratio="none" viewbox="0 0 340 140">
<defs>
<!-- Filled area gradient -->
<lineargradient id="chartGradient" x1="0" x2="0" y1="0" y2="1">
<stop offset="0%" stop-color="#E1F1E6" stop-opacity="0.9"></stop>
<stop offset="55%" stop-color="#EFF6F1" stop-opacity="0.5"></stop>
<stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"></stop>
</lineargradient>
<!-- Radial glow for target indicator dot -->
<radialgradient cx="50%" cy="50%" id="dotHalo" r="50%">
<stop offset="0%" stop-color="#80D095" stop-opacity="0.35"></stop>
<stop offset="65%" stop-color="#A7E4B7" stop-opacity="0.18"></stop>
<stop offset="100%" stop-color="#D5F2DE" stop-opacity="0"></stop>
</radialgradient>
</defs>
<!-- Gradient Area Fill under the wave -->
<path d="M 0 108 
                 C 55 106, 95 86, 160 84 
                 C 220 82, 260 52, 312 50 
                 L 312 140 
                 L 0 140 Z" fill="url(#chartGradient)"></path>
<!-- Main Green Wave Line -->
<path d="M 0 108 
                 C 55 106, 95 86, 160 84 
                 C 220 82, 260 52, 312 50" fill="none" stroke="#80C995" stroke-linecap="round" stroke-width="2.2"></path>
<!-- Halo concentric circles at coordinate (312, 50) -->
<circle cx="312" cy="50" fill="url(#dotHalo)" r="28"></circle>
<circle cx="312" cy="50" fill="none" r="16" stroke="#9BD5AB" stroke-opacity="0.6" stroke-width="0.9"></circle>
<circle cx="312" cy="50" fill="#5EBC79" r="4.5"></circle>
<!-- Secondary dark anchor indicator dot on curve -->
<circle cx="312" cy="68" fill="#1C1F22" r="3.2"></circle>
</svg>
</div>
<!-- Metric Badges / Tags -->
<div class="flex items-center space-x-5 mt-2 px-1" data-purpose="metric-tags">
<!-- Trees improvement tag -->
<div class="flex items-center space-x-1.5">
<!-- Small pine tree SVG -->
<svg class="w-3.5 h-3.5 text-[#5EB877]" fill="currentColor" viewbox="0 0 24 24">
<path d="M12 2L6 11H9L5 17H11V22H13V17H19L15 11H18L12 2Z"></path>
</svg>
<span class="text-[12px] font-medium text-darkText">Trees improvement</span>
</div>
<!-- Air improvement tag -->

<!-- Dark pill with CO2 text -->
<div class="w-4 h-4 rounded-full bg-[#1C1F22] flex items-center justify-center text-[7px] font-bold text-white tracking-tighter">
              CO₂
            </div>
<span class="text-[12px] font-medium text-darkText">Air improvement</span>
</div>
</div>
</section>
<!-- END: PerformanceSection -->

<!-- Viewfinder Frame SVG -->
<svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24">

<path d="M4 8V5a1 1 0 0 1 1-1h3"></path>
<path d="M16 4h3a1 1 0 0 1 1 1v3"></path>
<path d="M20 16v3a1 1 0 0 1-1 1h-3"></path>
<path d="M8 20H5a1 1 0 0 1-1-1v-3"></path>
<!-- Center target aperture circle -->
<circle cx="12" cy="12" fill="currentColor" r="2.5"></circle>
</svg>
</button>
<!-- Settings Cog Icon -->
<button aria-label="Settings" class="w-10 h-10 flex items-center justify-center text-[#B0B7B3] hover:text-darkText transition-colors">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<circle cx="12" cy="12" r="3"></circle>
<path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
