[package]
name = "atmos_protocol"
version = "0.1.0"
edition = "2021"

[dependencies]
anchor-lang = { version = "0.31", features = ["init-if-needed"] }
anchor-spl = "0.31"

[features]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[lib]
crate-type = ["cdylib", "lib"]

[profile.release]
overflow-checks = true
lto = true
codegen-units = 1
