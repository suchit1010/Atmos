version: '3.9'

services:
  # ─── PostgreSQL + PostGIS ───────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: atmos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       karta
      POSTGRES_USER:     karta
      POSTGRES_PASSWORD: karta_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karta -d karta"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: atmos_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── ATMOS Backend ──────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atmos_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV:        development
      PORT:            3000
      DATABASE_URL:    postgresql://karta:karta_dev_password@postgres:5432/karta
      REDIS_URL:       redis://redis:6379
      JWT_SECRET:      dev-jwt-secret-change-in-production-32chars
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-prod-32chars
      SOLANA_RPC_URL:  https://api.devnet.solana.com
      LOG_LEVEL:       info
      RATE_LIMIT_MAX:  1000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
